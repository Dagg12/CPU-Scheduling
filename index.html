<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Professional CPU Scheduling Simulator for Operating Systems (CMPG324)." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <title>CPU Scheduling Lab | CMPG324</title>
    <style>
      .boot-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #0f172a; font: 16px/1.5 system-ui, sans-serif; }
      .boot-card { max-width: 620px; width: 100%; padding: 28px; border: 1px solid #cbd5e1; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
      .boot-card h1 { font-size: 22px; margin: 0 0 10px; }
      .boot-card p { color: #475569; margin: 0; }
      .boot-error { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; background: #fff1f2; color: #9f1239; overflow-wrap: anywhere; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen">
        <section class="boot-card">
          <h1>CPU Scheduling Lab</h1>
          <p id="boot-message">Loading the simulator… If this message stays on screen, the application script did not start correctly.</p>
          <pre id="boot-error" class="boot-error"></pre>
        </section>
      </main>
    </div>
    <noscript>
      <main class="boot-screen"><section class="boot-card"><h1>JavaScript is required</h1><p>Please enable JavaScript and reload CPU Scheduling Lab.</p></section></main>
    </noscript>
    <script>
      (() => {
        const showBootError = (message) => {
          const text = document.getElementById('boot-message');
          const detail = document.getElementById('boot-error');
          if (!text || !detail || !document.getElementById('root')?.querySelector('.boot-screen')) return;
          text.textContent = 'The application failed before the interface could start. Check the error below.';
          detail.style.display = 'block';
          detail.textContent = message;
        };
        window.addEventListener('error', (event) => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
            showBootError('Could not load application module: ' + event.target.src);
          } else if (event.message) {
            showBootError(event.message + (event.filename ? '\\n' + event.filename + ':' + event.lineno : ''));
          }
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          showBootError(String(event.reason?.stack || event.reason || 'Unknown startup error'));
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
